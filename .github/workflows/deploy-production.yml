name: Deploy production

# main 에 커밋이 들어오면 Vercel Deploy Hook 을 호출해 운영 배포를 만든다.
#
# Vercel 의 Git 자동 배포는 커밋 작성자가 배포 권한 있는 팀 멤버여야 동작한다.
# Viewer 권한 팀원이 머지한 커밋은 거기서 막히므로, 작성자와 상관없는 Deploy Hook 으로 올린다.
#
# 필요한 것: 저장소 Secret VERCEL_DEPLOY_HOOK_URL
#   (Vercel > dante-web > Settings > Git > Deploy Hooks 에서 branch main 으로 만든 URL)
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 다시 돌릴 수 있게

# 머지가 연달아 들어오면 앞의 호출은 취소하고 마지막 것만 남긴다.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel Deploy Hook 호출
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret 이 없다" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK_URL"
