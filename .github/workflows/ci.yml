name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 먼저 설치해야 setup-node 의 pnpm 캐시가 동작
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # squash merge 시 PR 제목이 main 의 커밋 메시지가 되므로 형식 검사
      - name: PR 제목 컨벤션 검사
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

      # Prisma Client 는 생성물이라 저장소에 없다. 만들기 전에는 @prisma/client 가
      # PrismaClient 를 export 하지 않아서 packages/db/index.ts 부터 타입이 깨진다.
      # DB 접속은 필요 없고 스키마만 읽는다.
      - run: pnpm db:generate

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
